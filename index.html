<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điểm Danh</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--pr:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#e3e8f2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#192032;--tx:#eef2fb;--mu:#93a0bd;--pr:#4f8bff;--ok:#34d17a;--bad:#ff6b6b;--bd:#2a3550}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:420px}.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:14px}
h1{margin:6px 0 18px;text-align:center;font-size:26px}label{display:block;font-size:14px;color:var(--mu);margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font-size:16px}
button{width:100%;padding:15px;border:0;border-radius:14px;background:var(--pr);color:#fff;font-size:17px;font-weight:700;margin-top:16px;cursor:pointer}
button:disabled{background:var(--ok);opacity:.85;cursor:default}button.ghost{background:none;color:var(--bad);border:1px solid var(--bd);font-size:15px;font-weight:600}
button.gray{background:var(--bd);color:var(--tx)}.hide{display:none}.err{color:var(--bad);text-align:center;min-height:22px;margin-top:10px;font-size:14px}
.clock{font-size:42px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}.date{text-align:center;color:var(--mu);font-size:14px}
.streak{text-align:center;font-size:52px;font-weight:800;margin:6px 0 0}.sub{text-align:center;color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.grid div{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.grid b{display:block;font-size:20px}.grid span{font-size:12px;color:var(--mu)}.top{display:flex;justify-content:space-between;align-items:center}
.top a{color:var(--pr);font-size:14px;cursor:pointer}dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);max-width:340px;padding:22px}
dialog::backdrop{background:#0008}.row{display:flex;gap:10px}
</style></head><body><main>
<h1>📋 Điểm Danh</h1>
<section id="login" class="card">
 <label for="ph">Số điện thoại</label><input id="ph" type="tel" inputmode="numeric" placeholder="09xxxxxxxx" autocomplete="tel">
 <label for="dob">Ngày sinh</label><input id="dob" type="date">
 <button id="bl">Đăng nhập</button><div id="e1" class="err"></div>
</section>
<section id="app" class="hide">
 <div class="card"><div class="top"><b id="nm"></b><a id="lo">Đăng xuất</a></div>
  <div class="clock" id="clk">--:--:--</div><div class="date" id="dt"></div></div>
 <div class="card"><div class="streak">🔥 <span id="st">0</span></div><div class="sub">ngày liên tiếp</div>
  <button id="ck">ĐIỂM DANH</button><div id="e2" class="err"></div>
  <div class="grid"><div><b id="lt">—</b><span>Lần gần nhất</span></div><div><b id="tt">0</b><span>Tổng ngày</span></div>
  <div><b id="bs">0</b><span>Chuỗi cao nhất</span></div><div><b id="td">Chưa</b><span>Hôm nay</span></div></div></div>
 <button id="rs" class="ghost">Reset tiến độ</button>
</section></main>
<dialog id="dlg"><b>Xác nhận reset?</b><p style="color:var(--mu);font-size:14px">Chuỗi, kỷ lục, tổng ngày và lần điểm danh gần nhất của bạn sẽ bị xóa khỏi data.xlsx. Không thể hoàn tác.</p>
 <div class="row"><button class="gray" id="no">Hủy</button><button id="yes" style="background:var(--bad)">Reset</button></div></dialog>
<script>
const $=i=>document.getElementById(i),VN={timeZone:'Asia/Ho_Chi_Minh'};const API='';/* DÁN URL APPS SCRIPT VÀO ĐÂY; để trống = dùng server.py */
let ss=JSON.parse(sessionStorage.getItem('c')||'null'),off=0;const save=()=>sessionStorage.setItem('c',JSON.stringify(ss));
async function api(p,b={}){let r,d;const body=JSON.stringify({action:p,...ss,...b});
 try{r=await(API?fetch(API,{method:'POST',body}):fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body}));d=await r.json()}
 catch(e){return{error:'Không kết nối được máy chủ'}}
 if((r.status===401||d.code===401)&&p!=='login')out();return d}
function out(){ss=null;sessionStorage.removeItem('c');$('app').classList.add('hide');$('login').classList.remove('hide')}
function show(s){off=new Date(s.now)-new Date();$('login').classList.add('hide');$('app').classList.remove('hide');
 $('nm').textContent=s.name+' · '+s.phone;$('st').textContent=s.streak;$('tt').textContent=s.total;$('bs').textContent=s.best;
 $('lt').textContent=s.last_time?s.last_time+' '+s.last_date.slice(0,5):'—';$('td').textContent=s.checked?'Đã ✓':'Chưa';
 $('ck').disabled=s.checked;$('ck').textContent=s.checked?'✓ ĐÃ ĐIỂM DANH LÚC '+s.last_time:'ĐIỂM DANH'}
setInterval(()=>{const n=new Date(Date.now()+off);$('clk').textContent=n.toLocaleTimeString('vi-VN',{...VN,hour12:false});
 $('dt').textContent=n.toLocaleDateString('vi-VN',{...VN,weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})},500);
$('bl').onclick=async()=>{$('e1').textContent='';ss={phone:$('ph').value,dob:$('dob').value};const d=await api('login');
 if(d.error){ss=null;return $('e1').textContent=d.error}if(d.token)ss.token=d.token;save();show(d)};
$('ck').onclick=async()=>{$('e2').textContent='';$('ck').disabled=true;const d=await api('checkin');
 if(d.error){$('e2').textContent=d.error;if(!d.name){$('ck').disabled=false;return}}d.name&&show(d)};
$('rs').onclick=()=>$('dlg').showModal();$('no').onclick=()=>$('dlg').close();
$('yes').onclick=async()=>{$('dlg').close();const d=await api('reset');d.error?$('e2').textContent=d.error:show(d)};
$('lo').onclick=out;
if(ss)api('me').then(d=>d.name&&show(d));
</script></body></html>
