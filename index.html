<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điểm Danh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff5;--card:#fff;--ink:#0f1b2d;--mute:#667085;--line:#dde2ec;--acc:#2457ff;--on:#fff;--fire:#e8590c;--warn:#c0261b}
@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#141c2e;--ink:#eef2fb;--mute:#8c97ad;--line:#243049;--acc:#6b8cff;--on:#0c1220;--fire:#ff9a52;--warn:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:460px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:800;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me img{width:36px;height:36px;border-radius:50%}
.me span{font-size:.85rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.link{background:none;color:var(--mute);font-size:.85rem;padding:6px 8px;text-decoration:underline}
.clock{text-align:center;margin:8px 0 28px}
.clock b{display:block;font-size:2.6rem;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock small{color:var(--mute)}
.stamp{display:block;margin:0 auto 12px;width:200px;height:200px;border-radius:50%;background:var(--acc);color:var(--on);font-size:1.5rem;font-weight:800;box-shadow:0 0 0 8px var(--bg),0 0 0 11px var(--acc);transition:transform .12s}
.stamp:active:not(:disabled){transform:scale(.94)}
.stamp:disabled{background:var(--card);color:var(--ink);box-shadow:0 0 0 8px var(--bg),0 0 0 11px var(--line);cursor:default;font-size:1rem;font-weight:600;line-height:1.4}
.stamp:disabled strong{display:block;font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.hint{text-align:center;color:var(--mute);font-size:.9rem;min-height:1.4em;margin:0 0 28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--mute)}
.stat.fire b{color:var(--fire)}
h2{font-size:1rem;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:.92rem}
li+li{border-top:1px solid var(--line)}
li time{color:var(--mute);font-variant-numeric:tabular-nums}
.empty{padding:20px 16px;color:var(--mute);text-align:center;font-size:.92rem}
.reset{display:block;margin:28px auto 0;color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center;margin-top:12vh}
.card p{color:var(--mute);margin:8px 0 24px}
.card code{font-size:.85rem;overflow-wrap:anywhere}
.g{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:12px 20px;font-weight:600}
.g svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:2px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:340px;padding:24px}
dialog::backdrop{background:rgba(5,10,20,.6)}
dialog p{color:var(--mute);margin:8px 0 20px}
.row{display:flex;gap:10px;justify-content:flex-end}
.row button{padding:10px 16px;font-weight:600;background:var(--bg);color:var(--ink)}
.row .danger{background:var(--warn);color:#fff}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0));max-width:428px;margin:0 auto;background:var(--warn);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9rem}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="root"></main>
<div id="toast" role="alert" hidden></div>
<dialog id="dlg">
  <h2>Reset toàn bộ điểm danh?</h2>
  <p id="dlgText"></p>
  <div class="row">
    <button id="no">Hủy</button>
    <button id="yes" class="danger">Xác nhận reset</button>
  </div>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDocs,onSnapshot,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== DÁN CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY ===== */
const firebaseConfig = {
  apiKey: "DÁN_API_KEY",
  authDomain: "DÁN_PROJECT_ID.firebaseapp.com",
  projectId: "DÁN_PROJECT_ID",
  appId: "DÁN_APP_ID"
};
/* ================================================== */

const $ = s => document.querySelector(s);
const root = $("#root");
const TZ = "Asia/Ho_Chi_Minh";
const f = (o, d) => new Intl.DateTimeFormat("vi-VN", {timeZone: TZ, ...o}).format(d);
const keyOf = d => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(d);
const fTime = d => f({hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false}, d);
const fDate = d => f({weekday: "long", day: "2-digit", month: "2-digit", year: "numeric"}, d);
const prev = k => new Date(Date.parse(k + "T00:00:00Z") - 864e5).toISOString().slice(0, 10);

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 6000);
}

function streaks(keys, today){
  const s = new Set(keys);
  let cur = 0, k = s.has(today) ? today : prev(today);
  while(s.has(k)){ cur++; k = prev(k); }
  let best = 0, run = 0, last = null;
  for(const x of [...s].sort()){
    run = last && prev(x) === last ? run + 1 : 1;
    best = Math.max(best, run); last = x;
  }
  return {cur, best};
}

if(firebaseConfig.apiKey.startsWith("DÁN")){
  root.innerHTML = `<div class="card"><h1>Chưa cấu hình Firebase</h1>
  <p>Mở <code>index.html</code>, dán <code>firebaseConfig</code> của dự án Firebase vào đầu phần script rồi tải lại trang.</p></div>`;
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let unsub = null, tick = null;

  onAuthStateChanged(auth, user => {
    unsub && unsub(); clearInterval(tick);
    user ? showApp(user) : showLogin();
  });

  function showLogin(){
    root.innerHTML = `<div class="card"><h1>Điểm Danh</h1>
      <p>Đăng nhập hoặc đăng ký bằng tài khoản Google để lưu điểm danh của bạn.</p>
      <button class="g" id="login"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.500 42.600 14.600 48 24 48z"/></svg>Tiếp tục với Google</button></div>`;
    $("#login").onclick = async () => {
      try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
      catch(e){
        toast(e.code === "auth/unauthorized-domain"
          ? "Tên miền này chưa được cho phép. Thêm nó vào Authentication > Settings > Authorized domains trong Firebase."
          : "Không đăng nhập được (" + (e.code || e.message) + ").");
      }
    };
  }

  function showApp(user){
    root.innerHTML = `
      <div class="top">
        <div class="me">${user.photoURL ? `<img src="${user.photoURL}" alt="" referrerpolicy="no-referrer">` : ""}<span>${user.displayName || user.email}</span></div>
        <button class="link" id="out">Đăng xuất</button>
      </div>
      <div class="clock"><b id="now"></b><small id="today"></small></div>
      <button class="stamp" id="stamp" disabled>Đang tải…</button>
      <p class="hint" id="hint"></p>
      <div class="stats">
        <div class="stat fire"><b id="cur">0</b><span>Chuỗi hiện tại</span></div>
        <div class="stat"><b id="best">0</b><span>Chuỗi dài nhất</span></div>
        <div class="stat"><b id="total">0</b><span>Tổng số ngày</span></div>
      </div>
      <h2>Lịch sử</h2>
      <ul id="list"></ul>
      <button class="link reset" id="reset">Reset toàn bộ</button>`;

    $("#out").onclick = () => signOut(auth);
    const col = collection(db, "users", user.uid, "checkins");
    let docs = [], loaded = false, busy = false;

    function render(){
      const now = new Date(), today = keyOf(now);
      $("#now").textContent = fTime(now);
      $("#today").textContent = fDate(now);
      const keys = docs.map(d => d.key);
      const {cur, best} = streaks(keys, today);
      $("#cur").textContent = cur; $("#best").textContent = best; $("#total").textContent = keys.length;
      const mine = docs.find(d => d.key === today);
      const st = $("#stamp");
      if(!loaded){ st.disabled = true; st.textContent = "Đang tải…"; }
      else if(mine){
        st.disabled = true;
        st.innerHTML = `Đã điểm danh<strong>${fTime(mine.at)}</strong>`;
        $("#hint").textContent = "Hẹn gặp bạn vào ngày mai.";
      } else {
        st.disabled = busy; st.textContent = busy ? "Đang ghi…" : "Điểm danh";
        $("#hint").textContent = cur ? `Điểm danh hôm nay để giữ chuỗi ${cur} ngày.` : "Nhấn để bắt đầu chuỗi đầu tiên.";
      }
      const list = $("#list");
      list.innerHTML = docs.length
        ? [...docs].sort((a, b) => b.key.localeCompare(a.key)).slice(0, 30)
            .map(d => `<li><span>${fDate(d.at)}</span><time>${fTime(d.at)}</time></li>`).join("")
        : `<li class="empty">Chưa có lần điểm danh nào.</li>`;
    }

    unsub = onSnapshot(col, snap => {
      docs = snap.docs.map(d => ({key: d.id, at: d.data({serverTimestamps: "estimate"}).at.toDate()}));
      loaded = true; render();
    }, e => toast("Không đọc được dữ liệu (" + e.code + "). Kiểm tra Firestore Rules."));
    tick = setInterval(render, 1000);

    $("#stamp").onclick = async () => {
      busy = true; render();
      try{
        await setDoc(doc(col, keyOf(new Date())), {at: serverTimestamp()});
      }catch(e){
        toast(e.code === "permission-denied"
          ? "Bị từ chối: hôm nay đã điểm danh, hoặc đồng hồ thiết bị lệch ngày so với máy chủ."
          : "Không ghi được (" + (e.code || e.message) + ").");
      }
      busy = false; render();
    };

    $("#reset").onclick = () => {
      $("#dlgText").textContent = `Toàn bộ ${docs.length} lần điểm danh và chuỗi sẽ bị xóa vĩnh viễn. Không thể hoàn tác.`;
      $("#dlg").showModal();
    };
    $("#no").onclick = () => $("#dlg").close();
    $("#yes").onclick = async () => {
      $("#dlg").close();
      try{
        const all = (await getDocs(col)).docs;
        for(let i = 0; i < all.length; i += 400){
          const b = writeBatch(db);
          all.slice(i, i + 400).forEach(d => b.delete(d.ref));
          await b.commit();
        }
      }catch(e){ toast("Không reset được (" + (e.code || e.message) + ")."); }
    };
  }
}
</script>
</body>
</html>
