<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Like & View Counter</title>
  <meta name="description" content="Trang Like và đếm lượt xem theo quốc gia">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    
    /* Loading */
    .loading {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    
    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #94a3b8;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin-top: 16px;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải...</div>
  </div>

  <!-- Nhúng Apps Script -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyFdw7Nk7uUGpPsv4bKH1QWnA-lS0PAB-7S9tjBvKjCbEM3tImahzTAQEYize1FfNoZ7g/exec"
    allowfullscreen
    loading="eager">
  </iframe>

  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');

    frame.onload = function () {
      setTimeout(() => {
        loading.classList.add('hide');
      }, 500);
    };

    // Fallback nếu load quá lâu
    setTimeout(() => {
      loading.classList.add('hide');
    }, 6000);
  </script>

</body>
</html>
